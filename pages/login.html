<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" dir="rtl" content="width=device-width, initial-scale=1.0">
    <title>Orax Erp</title>
    <link rel="stylesheet" href="/css/output.css">
    <style>
        #networkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Ensure canvas is behind content */
        }
    </style>
</head>

<body
    class="overflow-hidden h-screen flex items-center justify-center relative font-lama-bold bg-(--background-color) dark:bg-gradient-to-b from-gray-950 to-gray-700">

    <canvas id="networkCanvas"></canvas>

    <div class="relative z-10 text-gray-900 text-center p-8 bg-white bg-opacity-70 rounded-lg shadow-lg">
        <div class="grid grid-cols-1 items-center justify-items-center grid-rows-2 h-20 mb-4">
            <img src="/assets/img/logo.png" alt="Logo" class="h-18 row-span-1">
            <h1 class="text-2xl max-md:text-sm font-bold text-gray-800 dark:text-white row-span-1 mt-3">Orax ERP</h1>
        </div>
        <input id="searchInput" type="text" placeholder="Search..."
            class="w-full py-2 pl-10 pr-4 border text-gray-700 dark:text-(--text-dark-color) border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        <button
            class="mt-8 px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-full text-lg font-semibold text-white transition duration-300">
            Learn More
        </button>
    </div>

    <!-- <script src="/js/main.js"></script> -->
    <script src="/js/pages/login.js"></script>
    <script src="/tw-elements/js/tw-elements.umd.min.js"></script>
</body>

</html>
