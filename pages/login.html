<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" dir="rtl" content="width=device-width, initial-scale=1.0">
    <title>Orax Erp</title>
    <link rel="stylesheet" href="/css/output.css">
    <style>
        #networkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Ensure canvas is behind content */
        }
    </style>
</head>

<body
    class="overflow-hidden h-screen flex items-center justify-center relative font-lama-bold bg-(--background-color) dark:bg-gradient-to-b from-gray-950 to-gray-700">

    <canvas id="networkCanvas"></canvas>

    <div class="relative z-10 text-gray-900 text-center p-8 bg-white bg-opacity-70 rounded-lg shadow-lg">
        <div class="grid grid-cols-1 items-center justify-items-center grid-rows-2 h-20 mb-4">
            <img src="/assets/img/logo.png" alt="Logo" class="h-18 row-span-1">
            <h1 class="text-2xl max-md:text-sm font-bold text-gray-800 dark:text-white row-span-1 mt-3">Orax ERP</h1>
        </div>
        <form class="max-w-sm mx-auto">
            <div class="mb-5">
                <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">الرقم المميز</label>
                <input type="email" id="email"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="name@flowbite.com" required />
            </div>
            <div class="mb-5">
                <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">كلمة السر</label>
                <input type="password" id="password"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    required />
            </div>
            <button
                class="mt-8 px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-full text-lg font-semibold text-white transition duration-300">
                Learn More
            </button>
        </form>

    </div>

    <!-- <script src="/js/main.js"></script> -->
    <script src="/js/pages/login.js"></script>
    <script src="/tw-elements/js/tw-elements.umd.min.js"></script>
</body>

</html>
