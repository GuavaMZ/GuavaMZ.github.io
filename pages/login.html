<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" dir="rtl" content="width=device-width, initial-scale=1.0">
    <title>Orax Erp</title>
    <link rel="stylesheet" href="/css/output.css">
    <style>
        #networkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
    </style>
</head>

<body
    class="overflow-hidden h-screen flex items-center justify-center relative font-lama-bold bg-(--background-color) dark:bg-gradient-to-b from-gray-950 to-gray-700">

    <canvas id="networkCanvas"></canvas>

    <div class="relative z-10 text-gray-900 text-center p-8 bg-white bg-opacity-70 rounded-lg shadow-lg">
        <div class="grid grid-cols-1 items-center justify-items-center grid-rows-2 h-20 mb-2.5">
            <img src="/assets/img/logo.png" alt="Logo" class="h-16 row-span-1">
            <h1 class="text-md max-md:text-sm font-bold text-black dark:text-white row-span-1 mt-3">مرحبا بك في Orax ERP</h1>
        </div>
        <form class="w-68 mx-auto">
            <div class="mb-2.5">
                <label for="email"
                    class="block mb-1.5 text-start text-sm font-medium text-gray-900 dark:text-white">الرقم
                    المميز</label>
                <input type="number" id="email"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="12345" required />
            </div>
            <div class="mb-2.5">
                <label for="financial-year"
                    class="block mb-1.5 text-start text-sm font-medium text-gray-900 dark:text-white">السنة
                    المالية</label>
                <button type="button"
                    class="inline-flex justify-between w-full rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                    id="financial-year-menu-button" aria-expanded="true" aria-haspopup="true">
                    اختر السنة المالية
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                        aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <div id="financial-year-menu" class="w-max absolute z-30 rounded-md shadow-lg bg-white" role="menu"
                    aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1" style="display: none;">
                    <div class="py-1" role="none">
                        <a href="#" class="financial-year-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-0">1</a>
                        <a href="#" class="financial-year-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-1">2</a>
                        <a href="#" class="financial-year-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-2">3</a>
                    </div>
                </div>
            </div>
            <div class="mb-2.5">
                <label for="sys-user"
                    class="block mb-1.5 text-start text-sm font-medium text-gray-900 dark:text-white">المستخدم</label>
                <button type="button"
                    class="inline-flex justify-between w-full rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                    id="sys-user-menu-button" aria-expanded="true" aria-haspopup="true">
                    اختر المستخدم
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                        aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <div id="sys-user-menu" class="w-max absolute z-30 rounded-md shadow-lg bg-white" role="menu"
                    aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1" style="display: none;">
                    <div class="py-1" role="none">
                        <a href="#" class="sys-user-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-0">مستخدم 1</a>
                        <a href="#" class="sys-user-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-1">مستخدم 2</a>
                        <a href="#" class="sys-user-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-2">مستخدم 3</a>
                    </div>
                </div>
            </div>
            <div class="mb-2.5">
                <label for="branch"
                    class="block mb-1.5 text-start text-sm font-medium text-gray-900 dark:text-white">الفرع</label>
                <button type="button"
                    class="inline-flex justify-between w-full rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                    id="branch-menu-button" aria-expanded="true" aria-haspopup="true">
                    اختر الفرع
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                        aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <div id="branch-menu" class="w-max absolute z-30 rounded-md shadow-lg bg-white" role="menu"
                    aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1" style="display: none;">
                    <div class="py-1" role="none">
                        <a href="#" class="branch-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-0">فرع 1</a>
                        <a href="#" class="branch-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-1">فرع 2</a>
                        <a href="#" class="branch-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-2">فرع 3</a>
                    </div>
                </div>
            </div>
            <div class="mb-2.5">
                <label for="language"
                    class="block mb-1.5 text-start text-sm font-medium text-gray-900 dark:text-white">اللغة</label>
                <button type="button"
                    class="inline-flex justify-between w-full rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                    id="language-menu-button" aria-expanded="true" aria-haspopup="true">
                    اختر اللغة
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                        aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <div id="language-menu" class="w-max absolute z-30 rounded-md shadow-lg bg-white" role="menu"
                    aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1" style="display: none;">
                    <div class="py-1" role="none">
                        <a href="#" class="language-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-0">اللغة العربية</a>
                        <a href="#" class="language-item text-gray-700 block px-8 py-2 text-sm hover:bg-gray-100"
                            role="menuitem" tabindex="-1" id="menu-item-1">اللغة الإنجليزية</a>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label for="password"
                    class="block mb-1.5 text-start text-sm font-medium text-gray-900 dark:text-white">كلمة السر</label>
                <input type="password" id="password"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    required />
            </div>
            <button onclick="location.href = '/index.html'"
                class="mt-4 px-6 py-3 bg-blue-400 dark:bg-(--cards-background-dark-color) hover:bg-blue-700 rounded-full text-white shadow-md hover: transform hover:scale-105 transition-all duration-300">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <!-- <script src="/js/main.js"></script> -->
    <script src="/js/pages/login.js"></script>
    <script src="/tw-elements/js/tw-elements.umd.min.js"></script>
</body>

</html>
